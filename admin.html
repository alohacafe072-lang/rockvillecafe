<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Rockville — Reserveringen</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#08080f; --navy:#0d0d1f; --dark:#12122a; --mid:#1a1a3a;
  --purple:#6b21d6; --purple-light:#8b44e8; --purple-glow:#a855f7;
  --amber:#c8840a; --amber-glow:#f5b942;
  --cream:#f0e6d0; --cream-dim:#a89878; --white:#fafafa;
  --groen:#1f7a3d; --groen-licht:#4ade80;
  --rood:#8b2020; --rood-licht:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#121228;color:var(--cream);font-family:'Oswald',sans-serif;font-weight:300;font-size:16px;line-height:1.6;}

/* ---------- INLOG ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{background:#1c1c3d;border:1px solid rgba(168,85,247,0.3);padding:44px 36px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,0.4);}
.login-box img{width:90px;height:90px;border-radius:50%;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(107,33,214,0.7));}
.login-box h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--white);letter-spacing:0.05em;margin-bottom:4px;}
.login-box .sub{font-size:0.7rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--purple-glow);margin-bottom:28px;}
.login-box input{width:100%;background:#2a2a4d;border:1px solid rgba(168,85,247,0.35);color:var(--white);font-family:'Oswald',sans-serif;font-size:1rem;padding:13px 14px;outline:none;margin-bottom:10px;transition:all 0.2s;}
.login-box input::placeholder{color:rgba(240,230,208,0.45);}
.login-box input:focus{border-color:var(--purple-glow);background:#31315a;box-shadow:0 0 0 3px rgba(168,85,247,0.15);}
.login-box button{width:100%;background:var(--purple);color:var(--white);font-family:'Oswald',sans-serif;font-weight:600;font-size:0.85rem;letter-spacing:0.2em;text-transform:uppercase;border:none;padding:14px;cursor:pointer;margin-top:6px;}
.login-box button:hover{background:var(--purple-light);}
.login-fout{color:var(--rood-licht);font-size:0.85rem;margin-top:14px;min-height:20px;}

/* ---------- APP ---------- */
#app{display:none;}
header{background:rgba(8,8,15,0.95);border-bottom:1px solid rgba(107,33,214,0.25);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100;}
.merk{display:flex;align-items:center;gap:12px;}
.merk img{width:38px;height:38px;border-radius:50%;}
.merk-naam{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:0.08em;color:var(--white);line-height:1;}
.merk-rol{font-size:0.62rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--purple-glow);}
.kop-rechts{display:flex;align-items:center;gap:14px;}
.live{display:flex;align-items:center;gap:7px;font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--cream-dim);}
.live-stip{width:7px;height:7px;border-radius:50%;background:var(--groen-licht);animation:knipper 2s ease-in-out infinite;}
@keyframes knipper{0%,100%{opacity:1}50%{opacity:0.25}}
.uitlog{background:#1c1c3d;border:1px solid rgba(168,85,247,0.35);color:#c4b59a;font-family:'Oswald',sans-serif;font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;padding:7px 14px;cursor:pointer;}
.uitlog:hover{border-color:var(--purple-glow);color:var(--purple-glow);}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:2px;padding:16px 24px 0;flex-wrap:wrap;}
.tab{background:#1c1c3d;border:1px solid rgba(168,85,247,0.22);color:#c4b59a;font-family:'Oswald',sans-serif;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;padding:11px 22px;cursor:pointer;position:relative;}
.tab.actief{background:var(--purple);color:var(--white);border-color:var(--purple);}
.tab .telling{display:inline-block;background:rgba(255,255,255,0.15);border-radius:10px;padding:1px 8px;margin-left:7px;font-size:0.72rem;}
.tab.actief .telling{background:rgba(0,0,0,0.25);}

/* ---------- FILTERS ---------- */
.filters{display:flex;gap:8px;padding:16px 24px 0;flex-wrap:wrap;align-items:center;}
.filter{background:#16162e;border:1px solid rgba(168,85,247,0.3);color:#c4b59a;font-family:'Oswald',sans-serif;font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;padding:7px 14px;cursor:pointer;}
.filter.actief{background:rgba(107,33,214,0.25);border-color:var(--purple-glow);color:var(--purple-glow);}

/* ---------- LIJST ---------- */
main{padding:20px 24px 60px;max-width:1100px;margin:0 auto;}
.dag-kop{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--amber-glow);letter-spacing:0.05em;margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid rgba(107,33,214,0.2);}
.dag-kop:first-child{margin-top:0;}
.dag-kop .dag-totaal{font-family:'Oswald',sans-serif;font-size:0.78rem;font-weight:300;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.75);margin-left:10px;}

.kaart{background:#3a2470;border:1px solid rgba(168,85,247,0.4);border-left:5px solid var(--purple-glow);padding:18px 22px;margin-bottom:2px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;transition:background 0.2s;}
.kaart:hover{background:#452b82;}
.kaart.nieuw-binnen{animation:oplichten 2.5s ease-out;}
@keyframes oplichten{0%{background:#6b21d6;border-left-color:var(--amber-glow);}100%{background:#3a2470;border-left-color:var(--purple-glow);}}
.kaart[data-status="bevestigd"]{border-left-color:var(--groen-licht);background:#2f3a5c;}
.kaart[data-status="afgewezen"],.kaart[data-status="geannuleerd"]{border-left-color:rgba(168,152,120,0.35);background:#252540;opacity:0.7;}

.tijd-blok{text-align:center;min-width:64px;}
.tijd{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--white);line-height:1;}
.personen{font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.8);margin-top:3px;}

.info .naam{font-size:1.15rem;color:var(--white);font-weight:600;}
.info .contact{font-size:0.88rem;color:rgba(255,255,255,0.85);margin-top:3px;}
.info .contact a{color:rgba(255,255,255,0.9);text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.3);}
.info .contact a:hover{color:var(--purple-glow);}
.info .extra{font-size:0.86rem;color:var(--amber-glow);margin-top:6px;font-style:italic;}
.label{display:inline-block;font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;padding:2px 8px;margin-top:6px;margin-right:5px;border:1px solid rgba(107,33,214,0.3);color:var(--purple-glow);}
.label.bron-telefoon{border-color:rgba(245,185,66,0.4);color:var(--amber-glow);}

.acties{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.knop{font-family:'Oswald',sans-serif;font-size:0.74rem;letter-spacing:0.12em;text-transform:uppercase;padding:11px 18px;cursor:pointer;border:1px solid;background:transparent;white-space:nowrap;}
.knop-ok{border-color:rgba(74,222,128,0.7);color:#86efac;background:rgba(20,80,40,0.5);}
.knop-ok:hover{background:var(--groen);color:var(--white);}
.knop-nee{border-color:rgba(248,113,113,0.6);color:#fca5a5;background:rgba(90,25,25,0.5);}
.knop-nee:hover{background:var(--rood);color:var(--white);}
.knop:disabled{opacity:0.4;cursor:not-allowed;}
.status-vast{font-size:0.74rem;letter-spacing:0.15em;text-transform:uppercase;padding:8px 14px;color:rgba(255,255,255,0.85);}
.status-vast.bevestigd{color:#86efac;font-weight:400;}
.status-vast.afgewezen{color:rgba(255,255,255,0.6);}

.knop-wis{border-color:rgba(168,152,120,0.25);color:rgba(168,152,120,0.6);background:transparent;padding:8px 12px;font-size:0.8rem;margin-left:6px;}
.knop-wis:hover{border-color:rgba(248,113,113,0.5);color:var(--rood-licht);background:rgba(248,113,113,0.08);}
.knop-reactie{border-color:rgba(255,255,255,0.4);color:var(--white);background:rgba(255,255,255,0.1);}
.knop-reactie:hover{background:rgba(255,255,255,0.25);color:var(--white);}

.reactie-vak{display:none;grid-column:1/-1;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.25);}
.reactie-vak textarea{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(168,85,247,0.35);color:var(--white);font-family:'Oswald',sans-serif;font-weight:300;font-size:0.95rem;padding:12px 14px;outline:none;resize:vertical;min-height:90px;}
.reactie-vak textarea::placeholder{color:rgba(255,255,255,0.5);}
.reactie-vak textarea:focus{border-color:var(--purple-glow);background:#31315a;}
.reactie-knoppen{display:flex;gap:8px;margin-top:10px;}
.knop-verstuur{border-color:rgba(168,85,247,0.6);color:var(--white);background:var(--purple);}
.knop-verstuur:hover{background:var(--purple-light);}
.knop-sluit{border-color:rgba(168,85,247,0.25);color:#c4b59a;background:transparent;}

.leeg{text-align:center;padding:70px 20px;color:var(--cream-dim);}
.leeg .icoon{font-size:2.6rem;display:block;margin-bottom:14px;opacity:0.5;}

/* ---------- MOBIEL / TABLET ---------- */
@media(max-width:820px){
  header{padding:12px 16px;}
  .tabs,.filters{padding-left:16px;padding-right:16px;}
  main{padding:16px 16px 50px;}
  .kaart{grid-template-columns:auto 1fr;gap:14px;}
  .acties{grid-column:1/-1;justify-content:flex-start;padding-top:10px;border-top:1px solid rgba(107,33,214,0.12);}
  .knop{flex:1;text-align:center;padding:11px 10px;}
}
</style>
</head>
<body>

<!-- ============ INLOG ============ -->
<div id="login">
  <div class="login-box">
    <img src="rockville-logo-2025.png" alt="Rockville Café">
    <h1>Rockville Café</h1>
    <div class="sub">Reserveringen</div>
    <input type="email" id="email" placeholder="E-mailadres" autocomplete="username">
    <input type="password" id="wachtwoord" placeholder="Wachtwoord" autocomplete="current-password">
    <button onclick="inloggen()">Inloggen</button>
    <div class="login-fout" id="loginFout"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="merk">
      <img src="rockville-logo-2025.png" alt="">
      <div>
        <div class="merk-naam">Rockville Café</div>
        <div class="merk-rol" id="rolLabel">Reserveringen</div>
      </div>
    </div>
    <div class="kop-rechts">
      <div class="live"><span class="live-stip"></span> Live</div>
      <button class="uitlog" onclick="uitloggen()">Uitloggen</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab actief" data-weergave="reserveringen" onclick="wisselTab('reserveringen')">
      Reserveringen <span class="telling" id="telReserveringen">0</span>
    </button>
    <button class="tab" data-weergave="quiz" onclick="wisselTab('quiz')">
      Quiz <span class="telling" id="telQuiz">0</span>
    </button>
  </div>

  <div class="filters" id="filters">
    <button class="filter actief" data-filter="komend" onclick="zetFilter('komend')">Vanaf vandaag</button>
    <button class="filter" data-filter="vandaag" onclick="zetFilter('vandaag')">Alleen vandaag</button>
    <button class="filter" data-filter="nieuw" onclick="zetFilter('nieuw')">Onbehandeld</button>
    <button class="filter" data-filter="alles" onclick="zetFilter('alles')">Alles</button>
  </div>

  <main id="lijst"></main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://rylguyuoydducktuvaas.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AjgrF-O0K3uOz7F8XG84Iw_YJlc-gmd';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let weergave = 'reserveringen';
let filter   = 'komend';
let data     = { reserveringen: [], quiz: [] };
let verseIds = new Set();

// ---------- INLOGGEN ----------
window.inloggen = async () => {
  const email = document.getElementById('email').value.trim();
  const wachtwoord = document.getElementById('wachtwoord').value;
  const fout = document.getElementById('loginFout');
  fout.textContent = '';

  if (!email || !wachtwoord) { fout.textContent = 'Vul e-mail en wachtwoord in.'; return; }

  const { error } = await db.auth.signInWithPassword({ email, password: wachtwoord });
  if (error) { fout.textContent = 'Inloggen mislukt. Controleer je gegevens.'; return; }
  start();
};

window.uitloggen = async () => {
  await db.auth.signOut();
  location.reload();
};

document.getElementById('wachtwoord').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.inloggen();
});

// ---------- OPSTARTEN ----------
async function start(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  const { data: sessie } = await db.auth.getUser();
  const rol = sessie?.user?.email?.startsWith('beheer') ? 'beheer' : 'personeel';
  document.body.dataset.rol = rol;
  document.getElementById('rolLabel').textContent =
    rol === 'beheer' ? 'Beheer' : 'Personeel — alleen inzien';

  await laden();
  luisterLive();
}

// ---------- DATA LADEN ----------
async function laden(){
  const [r, q] = await Promise.all([
    db.from('reserveringen').select('*').order('datum').order('tijdstip'),
    db.from('quiz_inschrijvingen').select('*').order('aangemaakt', { ascending: false })
  ]);
  data.reserveringen = r.data || [];
  data.quiz = q.data || [];
  teken();
}

// ---------- LIVE ----------
function luisterLive(){
  db.channel('wijzigingen')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reserveringen' }, p => {
      if (p.eventType === 'INSERT') { verseIds.add(p.new.id); pling(); }
      laden();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_inschrijvingen' }, p => {
      if (p.eventType === 'INSERT') { verseIds.add(p.new.id); pling(); }
      laden();
    })
    .subscribe();
}

function pling(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.start(); osc.stop(ctx.currentTime + 0.45);
  }catch(e){}
}

// ---------- TABS & FILTERS ----------
window.wisselTab = v => {
  weergave = v;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('actief', t.dataset.weergave === v));
  document.getElementById('filters').style.display = v === 'reserveringen' ? 'flex' : 'none';
  teken();
};

window.zetFilter = f => {
  filter = f;
  document.querySelectorAll('.filter').forEach(b =>
    b.classList.toggle('actief', b.dataset.filter === f));
  teken();
};

// ---------- STATUS WIJZIGEN ----------
// Status wijzigen + mail versturen
window.afhandelen = async (tabel, id, status) => {
  const rij = zoekRij(tabel, id);
  if (!rij) return;

  const isQuiz = tabel === 'quiz_inschrijvingen';
  const wat = status === 'bevestigd' ? 'bevestigen' : 'annuleren';
  const wie = isQuiz ? `team ${rij.teamnaam}` : rij.naam;
  if (!confirm(`Reservering van ${wie} ${wat}?\n\nEr gaat een mail naar ${rij.email}.`)) return;

  const knoppen = document.querySelectorAll(`[data-rij="${id}"] .knop`);
  knoppen.forEach(k => { k.disabled = true; });

  // 1. status opslaan
  const { error } = await db.from(tabel).update({ status }).eq('id', id);
  if (error) {
    alert('Wijzigen mislukt. Heb je beheerrechten?');
    knoppen.forEach(k => { k.disabled = false; });
    return;
  }

  // 2. mail versturen
  const soort = isQuiz
    ? (status === 'bevestigd' ? 'quiz-bevestiging' : 'quiz-annulering')
    : (status === 'bevestigd' ? 'bevestiging' : 'annulering');

  const gegevens = isQuiz
    ? { naam: rij.contactpersoon, team: rij.teamnaam, evenement: rij.evenement }
    : { naam: rij.naam, datum: datumVoluit(rij.datum), tijd: (rij.tijdstip||'').slice(0,5), aantal: rij.aantal };

  const gelukt = await stuurMail({ soort, naar: rij.email, gegevens });
  if (!gelukt) {
    alert('Status is aangepast, maar de mail is NIET verstuurd.\n\nNeem zelf even contact op met ' + rij.email);
  }
  laden();
};

// Verwijderen — alleen beheer, alleen wat voorbij is
window.verwijderen = async (tabel, id) => {
  const rij = zoekRij(tabel, id);
  if (!rij) return;

  const wie = tabel === 'quiz_inschrijvingen' ? `team ${rij.teamnaam}` : rij.naam;
  if (!confirm(`Reservering van ${wie} definitief verwijderen?\n\nDit kan niet ongedaan gemaakt worden.`)) return;

  const { error } = await db.from(tabel).delete().eq('id', id);
  if (error) alert('Verwijderen mislukt.\n\n' + error.message);
  else laden();
};

// Vrij bericht sturen zonder de status te wijzigen
window.toonReactie = (tabel, id) => {
  const vak = document.getElementById('reactie-' + id);
  if (!vak) return;
  const open = vak.style.display === 'block';
  vak.style.display = open ? 'none' : 'block';
  if (!open) vak.querySelector('textarea').focus();
};

window.stuurReactie = async (tabel, id) => {
  const rij = zoekRij(tabel, id);
  const vak = document.getElementById('reactie-' + id);
  const tekst = vak.querySelector('textarea').value.trim();
  if (!tekst) { alert('Typ eerst een bericht.'); return; }

  const knop = vak.querySelector('.knop-verstuur');
  knop.disabled = true;
  knop.textContent = 'Versturen...';

  const naam = tabel === 'quiz_inschrijvingen' ? rij.contactpersoon : rij.naam;
  const gelukt = await stuurMail({
    soort: 'reactie',
    naar: rij.email,
    gegevens: { naam },
    eigenTekst: tekst
  });

  if (gelukt) {
    knop.textContent = '\u2713 Verstuurd';
    setTimeout(()=>{ vak.style.display='none'; vak.querySelector('textarea').value=''; knop.disabled=false; knop.textContent='Versturen'; }, 1800);
  } else {
    alert('Versturen mislukt. Probeer het opnieuw of mail zelf naar ' + rij.email);
    knop.disabled = false;
    knop.textContent = 'Versturen';
  }
};

async function stuurMail(gegevens){
  try {
    const res = await fetch('/api/verstuur-mail', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(gegevens)
    });
    if (!res.ok) { console.error(await res.text()); return false; }
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function zoekRij(tabel, id){
  const lijst = tabel === 'quiz_inschrijvingen' ? data.quiz : data.reserveringen;
  return lijst.find(r => r.id === id);
}

function datumVoluit(datum){
  return new Date(datum + 'T12:00:00')
    .toLocaleDateString('nl-NL', { weekday:'long', day:'numeric', month:'long' });
}

// ---------- TEKENEN ----------
function teken(){
  const vandaag = new Date().toISOString().slice(0,10);

  document.getElementById('telReserveringen').textContent =
    data.reserveringen.filter(r => r.datum >= vandaag && r.status === 'nieuw').length;
  document.getElementById('telQuiz').textContent =
    data.quiz.filter(q => q.status === 'nieuw').length;

  const doel = document.getElementById('lijst');
  doel.innerHTML = weergave === 'reserveringen' ? tekenReserveringen(vandaag) : tekenQuiz();

  verseIds.clear();
}

function tekenReserveringen(vandaag){
  let lijst = [...data.reserveringen];
  if (filter === 'komend')  lijst = lijst.filter(r => r.datum >= vandaag);
  if (filter === 'vandaag') lijst = lijst.filter(r => r.datum === vandaag);
  if (filter === 'nieuw')   lijst = lijst.filter(r => r.status === 'nieuw');

  if (!lijst.length) return leegBericht('Geen reserveringen om te tonen.');

  const perDag = {};
  lijst.forEach(r => { (perDag[r.datum] ||= []).push(r); });

  return Object.keys(perDag).sort().map(datum => {
    const rijen = perDag[datum];
    const gasten = rijen
      .filter(r => r.status !== 'afgewezen' && r.status !== 'geannuleerd')
      .reduce((n, r) => n + schatAantal(r.aantal), 0);

    return `
      <div class="dag-kop">
        ${datumTekst(datum, vandaag)}
        <span class="dag-totaal">${rijen.length} reservering${rijen.length===1?'':'en'} · ± ${gasten} gasten</span>
      </div>
      ${rijen.map(r => kaartReservering(r)).join('')}
    `;
  }).join('');
}

function kaartReservering(r){
  const vers = verseIds.has(r.id) ? ' nieuw-binnen' : '';
  const extra = [r.gelegenheid, r.opmerkingen].filter(Boolean).join(' — ');
  return `
    <div class="kaart${vers}" data-status="${r.status}" data-rij="${r.id}">
      <div class="tijd-blok">
        <div class="tijd">${(r.tijdstip||'').slice(0,5)}</div>
        <div class="personen">${r.aantal} pers</div>
      </div>
      <div class="info">
        <div class="naam">${ontsmet(r.naam)}</div>
        <div class="contact">
          <a href="tel:${ontsmet(r.telefoon)}">${ontsmet(r.telefoon)}</a>
          &nbsp;·&nbsp;
          <a href="mailto:${ontsmet(r.email)}">${ontsmet(r.email)}</a>
        </div>
        ${extra ? `<div class="extra">${ontsmet(extra)}</div>` : ''}
        ${r.bron === 'telefoon' ? '<span class="label bron-telefoon">Via telefoon</span>' : ''}
      </div>
      <div class="acties">${actieKnoppen('reserveringen', r)}</div>
      ${reactieVak('reserveringen', r)}
    </div>`;
}

function tekenQuiz(){
  if (!data.quiz.length) return leegBericht('Nog geen quiz-inschrijvingen.');

  const perEvent = {};
  data.quiz.forEach(q => { (perEvent[q.evenement] ||= []).push(q); });

  return Object.keys(perEvent).map(evenement => {
    const teams = perEvent[evenement];
    const spelers = teams
      .filter(t => t.status !== 'afgewezen' && t.status !== 'geannuleerd')
      .reduce((n, t) => n + schatAantal(t.aantal_deelnemers), 0);

    return `
      <div class="dag-kop">
        ${ontsmet(evenement)}
        <span class="dag-totaal">${teams.length} team${teams.length===1?'':'s'} · ± ${spelers} spelers</span>
      </div>
      ${teams.map(t => `
        <div class="kaart${verseIds.has(t.id)?' nieuw-binnen':''}" data-status="${t.status}" data-rij="${t.id}">
          <div class="tijd-blok">
            <div class="tijd">${schatAantal(t.aantal_deelnemers)}</div>
            <div class="personen">spelers</div>
          </div>
          <div class="info">
            <div class="naam">${ontsmet(t.teamnaam)}</div>
            <div class="contact">
              ${ontsmet(t.contactpersoon)} ·
              <a href="tel:${ontsmet(t.telefoon)}">${ontsmet(t.telefoon)}</a> ·
              <a href="mailto:${ontsmet(t.email)}">${ontsmet(t.email)}</a>
            </div>
          </div>
          <div class="acties">${actieKnoppen('quiz_inschrijvingen', t)}</div>
          ${reactieVak('quiz_inschrijvingen', t)}
        </div>`).join('')}
    `;
  }).join('');
}

function reactieVak(tabel, rij){
  if (document.body.dataset.rol !== 'beheer') return '';
  if (rij.status === 'afgewezen' || rij.status === 'geannuleerd') return '';
  return `
    <div class="reactie-vak" id="reactie-${rij.id}">
      <textarea placeholder="Typ je bericht aan de gast..."></textarea>
      <div class="reactie-knoppen">
        <button class="knop knop-verstuur" onclick="stuurReactie('${tabel}','${rij.id}')">Versturen</button>
        <button class="knop knop-sluit" onclick="toonReactie('${tabel}','${rij.id}')">Sluiten</button>
      </div>
    </div>`;
}

function actieKnoppen(tabel, rij){
  const magWijzigen = document.body.dataset.rol === 'beheer';
  const afgehandeld = ['bevestigd','afgewezen','geannuleerd'].includes(rij.status);
  if (afgehandeld) {
    const woord = rij.status === 'bevestigd' ? '\u2713 Bevestigd'
                : rij.status === 'afgewezen' ? 'Afgewezen' : 'Geannuleerd';
    const kleur = rij.status === 'bevestigd' ? 'bevestigd' : 'afgewezen';

    // Verwijderen mag alleen als de datum voorbij is
    const vandaag = new Date().toISOString().slice(0,10);
    const voorbij = tabel === 'quiz_inschrijvingen'
      ? rij.aangemaakt < new Date(Date.now() - 30*864e5).toISOString()
      : rij.datum < vandaag;

    const wisknop = (magWijzigen && voorbij)
      ? `<button class="knop knop-wis" onclick="verwijderen('${tabel}','${rij.id}')" title="Definitief verwijderen">\u2715</button>`
      : '';

    return `<span class="status-vast ${kleur}">${woord}</span>${wisknop}`;
  }

  if (!magWijzigen) return '<span class="status-vast">Nog te bevestigen</span>';

  return `
    <button class="knop knop-ok"  onclick="afhandelen('${tabel}','${rij.id}','bevestigd')">✓ Bevestigen</button>
    <button class="knop knop-nee" onclick="afhandelen('${tabel}','${rij.id}','afgewezen')">Annuleren</button>
    <button class="knop knop-reactie" onclick="toonReactie('${tabel}','${rij.id}')">✎ Reactie</button>`;
}

// ---------- HULPJES ----------
function schatAantal(tekst){
  if (!tekst) return 0;
  const getallen = String(tekst).match(/\d+/g);
  if (!getallen) return 0;
  return Math.max(...getallen.map(Number));
}

function datumTekst(datum, vandaag){
  const d = new Date(datum + 'T12:00:00');
  const morgen = new Date(); morgen.setDate(morgen.getDate()+1);
  const morgenStr = morgen.toISOString().slice(0,10);

  if (datum === vandaag)   return 'Vandaag';
  if (datum === morgenStr) return 'Morgen';

  return d.toLocaleDateString('nl-NL', { weekday:'long', day:'numeric', month:'long' });
}

function leegBericht(tekst){
  return `<div class="leeg"><span class="icoon">🎸</span>${tekst}</div>`;
}

function ontsmet(t){
  return String(t ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}
